<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f4f4f5"/><g font-family="Microsoft YaHei, Segoe UI, sans-serif"><text x="80" y="90" fill="#52525b" font-size="24" font-weight="600">DSH UNBOUND / PATCH MANAGEMENT</text><text x="80" y="193" fill="#18181b" font-size="60" font-weight="700">补丁可查看，修改可还原</text><text x="80" y="256" fill="#71717a" font-size="29" font-weight="400">从确认状态到还原补丁，每一步都有明确入口。</text><rect x="80" y="350" width="330" height="330" rx="12" fill="#fff" stroke="#d4d4d8"/><text x="108" y="400" fill="#a1a1aa" font-size="24" font-weight="600">01</text><text x="108" y="471" fill="#18181b" font-size="44" font-weight="700">查看</text><text x="108" y="525" fill="#3f3f46" font-size="26" font-weight="600">分类与逐项状态</text><text x="108" y="588" fill="#71717a" font-size="22" font-weight="400">提示词 / 代码 / 工具</text><text x="108" y="629" fill="#71717a" font-size="22" font-weight="400">已应用 / 跳过 / 未匹配</text><path d="M418 515h24m-8-7 8 7-8 7" stroke="#a1a1aa" stroke-width="2" fill="none"/><rect x="450" y="350" width="330" height="330" rx="12" fill="#fff" stroke="#d4d4d8"/><text x="478" y="400" fill="#a1a1aa" font-size="24" font-weight="600">02</text><text x="478" y="471" fill="#18181b" font-size="44" font-weight="700">应用</text><text x="478" y="525" fill="#3f3f46" font-size="26" font-weight="600">调整当前宿主</text><text x="478" y="588" fill="#71717a" font-size="22" font-weight="400">核对目标与备份</text><text x="478" y="629" fill="#71717a" font-size="22" font-weight="400">应用后按提示重启</text><path d="M788 515h24m-8-7 8 7-8 7" stroke="#a1a1aa" stroke-width="2" fill="none"/><rect x="820" y="350" width="330" height="330" rx="12" fill="#fff" stroke="#d4d4d8"/><text x="848" y="400" fill="#a1a1aa" font-size="24" font-weight="600">03</text><text x="848" y="471" fill="#18181b" font-size="44" font-weight="700">诊断</text><text x="848" y="525" fill="#3f3f46" font-size="26" font-weight="600">导出排错信息</text><text x="848" y="588" fill="#71717a" font-size="22" font-weight="400">版本、编号与状态</text><text x="848" y="629" fill="#71717a" font-size="22" font-weight="400">限定字段，不自动上传</text><path d="M1158 515h24m-8-7 8 7-8 7" stroke="#a1a1aa" stroke-width="2" fill="none"/><rect x="1190" y="350" width="330" height="330" rx="12" fill="#fff" stroke="#d4d4d8"/><text x="1218" y="400" fill="#a1a1aa" font-size="24" font-weight="600">04</text><text x="1218" y="471" fill="#18181b" font-size="44" font-weight="700">还原</text><text x="1218" y="525" fill="#3f3f46" font-size="26" font-weight="600">恢复补丁修改</text><text x="1218" y="588" fill="#71717a" font-size="22" font-weight="400">根据备份执行恢复</text><text x="1218" y="629" fill="#71717a" font-size="22" font-weight="400">外部操作不会被撤销</text><path d="M80 749H1520" stroke="#d4d4d8"/><text x="80" y="808" fill="#27272a" font-size="33" font-weight="600">看得清状态，找得到原因，保留恢复路径。</text><text x="80" y="860" fill="#71717a" font-size="21" font-weight="400">流程示意 · 补丁状态不等于模型能力验证；应用前请保留同版宿主备份。</text></g></svg>