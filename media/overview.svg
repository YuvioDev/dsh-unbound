<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#101012"/><g font-family="Microsoft YaHei, Segoe UI, sans-serif"><text x="80" y="94" fill="#ffffff" font-size="28" font-weight="700">DSH UNBOUND</text><text x="1520" y="94" fill="#f4f4f5" font-size="20" font-weight="400"></text><text x="80" y="208" fill="#ffffff" font-size="64" font-weight="700">模型破甲，掌控你的工作流</text><text x="80" y="274" fill="#a1a1aa" font-size="30" font-weight="400">提示词注入 · 本地限制调整 · 补丁应用与还原</text><path d="M80 320H1520" stroke="#353539"/><text x="80" y="370" fill="#c6c6cd" font-size="22" font-weight="600">DEEPSEEK-V4.1-FLASH 1017</text><text x="1250" y="370" fill="#8b8b93" font-size="22" font-weight="400">功能架构示意</text><rect x="80" y="430" width="350" height="230" rx="16" fill="#171719" stroke="#3f3f46"/><text x="112" y="478" fill="#a1a1aa" font-size="21" font-weight="400">01 / 配置</text><text x="112" y="540" fill="#fff" font-size="35" font-weight="600">定义交互方式</text><text x="112" y="598" fill="#b5b5bd" font-size="24" font-weight="400">系统提示词 · 规则 · 技能</text><rect x="500" y="410" width="600" height="270" rx="16" fill="#f4f4f5" stroke="#f4f4f5"/><text x="538" y="464" fill="#52525b" font-size="21" font-weight="600">02 / DSH UNBOUND</text><text x="538" y="530" fill="#18181b" font-size="35" font-weight="700">管理本地提示与执行路径</text><text x="538" y="586" fill="#3f3f46" font-size="26" font-weight="400">提示词注入</text><text x="820" y="586" fill="#3f3f46" font-size="26" font-weight="400">宿主补丁</text><text x="538" y="638" fill="#52525b" font-size="25" font-weight="400">部分审批 · 沙箱 · 工具执行调整</text><rect x="1170" y="430" width="350" height="230" rx="16" fill="#171719" stroke="#3f3f46"/><text x="1202" y="478" fill="#a1a1aa" font-size="21" font-weight="400">03 / 运行</text><text x="1202" y="540" fill="#fff" font-size="32" font-weight="600">进入 DSH 工作流</text><text x="1202" y="598" fill="#b5b5bd" font-size="24" font-weight="400">模型交互 · 已配置工具</text><path d="M430